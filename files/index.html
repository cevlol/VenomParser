<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VenomProjects â€" Solar Proposal System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --venom-dark: #0a1628;
            --venom-darker: #05091a;
            --venom-blue: #1a2d4a;
            --venom-cyan: #00d9ff;
            --venom-green: #00ff87;
            --venom-green-dark: #00bf63;
            --venom-purple: #6366f1;
            --venom-red: #ef4444;
            --venom-yellow: #fbbf24;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--venom-darker) 0%, var(--venom-dark) 50%, var(--venom-blue) 100%);
            min-height: 100vh;
            color: #e5e7eb;
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .logo {
            height: 150px;
            width: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px rgba(0, 255, 135, 0.3));
        }

        .tagline {
            font-size: 14px;
            color: var(--venom-cyan);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Upload Section - Compact */
        .upload-section {
            background: rgba(26, 45, 74, 0.4);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .upload-zone {
            border: 2px dashed var(--venom-cyan);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 217, 255, 0.05);
        }

        .upload-zone:hover {
            border-color: var(--venom-green);
            background: rgba(0, 255, 135, 0.08);
            transform: translateY(-2px);
        }

        .upload-zone.dragover {
            border-color: var(--venom-green);
            background: rgba(0, 255, 135, 0.15);
        }

        .upload-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 14px;
            color: #9ca3af;
        }

        .upload-text strong {
            color: var(--venom-cyan);
            font-size: 15px;
        }

        #fileInput {
            display: none;
        }

        /* Terminal Window */
        .terminal-window {
            display: none;
            background: #000000;
            border: 1px solid var(--venom-cyan);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0, 217, 255, 0.2);
        }

        .terminal-window.active {
            display: block;
        }

        .terminal-header {
            background: linear-gradient(90deg, var(--venom-dark), var(--venom-blue));
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--venom-cyan);
        }

        .terminal-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-red { background: var(--venom-red); }
        .dot-yellow { background: var(--venom-yellow); }
        .dot-green { background: var(--venom-green); }

        .terminal-title {
            margin-left: 10px;
            font-size: 12px;
            color: var(--venom-cyan);
            font-family: 'Courier New', monospace;
        }

        .terminal-body {
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.8;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }

        .terminal-line {
            margin-bottom: 5px;
            animation: fadeInUp 0.3s ease;
        }

        .terminal-prompt {
            color: var(--venom-green);
        }

        .terminal-command {
            color: var(--venom-cyan);
        }

        .terminal-output {
            color: #9ca3af;
        }

        .terminal-success {
            color: var(--venom-green);
        }

        .terminal-error {
            color: var(--venom-red);
        }

        .terminal-cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--venom-green);
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Progress Bar */
        .progress-container {
            display: none;
            margin-bottom: 25px;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar-wrapper {
            background: rgba(26, 45, 74, 0.4);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid rgba(0, 217, 255, 0.2);
        }

        .progress-bar {
            height: 4px;
            background: rgba(0, 217, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--venom-cyan), var(--venom-green));
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--venom-cyan);
        }

        .progress-text {
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
        }

        /* Proposal Section */
        .proposal {
            display: none;
            animation: slideIn 0.5s ease;
        }

        .proposal.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Compact Grid Layout */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .info-card {
            background: rgba(26, 45, 74, 0.4);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(10px);
        }

        .info-card h3 {
            font-size: 13px;
            color: var(--venom-cyan);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .info-card p {
            font-size: 14px;
            color: #e5e7eb;
        }

        /* Satellite Section */
        .satellite-section {
            background: rgba(26, 45, 74, 0.4);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .satellite-section h2 {
            font-size: 18px;
            color: var(--venom-green);
            margin-bottom: 15px;
        }

        .satellite-container {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/9;
            background: #000;
        }

        .satellite-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .satellite-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            padding: 15px;
            color: white;
        }

        .satellite-overlay h3 {
            font-size: 14px;
            color: var(--venom-green);
            margin-bottom: 5px;
        }

        .satellite-overlay p {
            font-size: 12px;
            color: #9ca3af;
        }

        /* System Packages - Compact */
        .packages-section {
            margin-bottom: 25px;
        }

        .packages-section h2 {
            font-size: 18px;
            color: var(--venom-green);
            margin-bottom: 15px;
            text-align: center;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .package-card {
            background: rgba(26, 45, 74, 0.4);
            border: 2px solid rgba(0, 217, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .package-card:hover {
            border-color: var(--venom-green);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 255, 135, 0.2);
        }

        .package-card.recommended {
            border-color: var(--venom-green);
            background: rgba(0, 255, 135, 0.08);
        }

        .package-badge {
            display: inline-block;
            background: var(--venom-green);
            color: var(--venom-darker);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .package-name {
            font-size: 20px;
            color: var(--venom-cyan);
            margin-bottom: 8px;
        }

        .package-size {
            font-size: 32px;
            font-weight: bold;
            color: var(--venom-green);
            margin-bottom: 8px;
        }

        .package-price {
            font-size: 16px;
            color: #9ca3af;
            margin-bottom: 15px;
        }

        .package-features {
            text-align: left;
            margin-bottom: 15px;
        }

        .package-features li {
            font-size: 13px;
            color: #e5e7eb;
            margin-bottom: 6px;
            padding-left: 20px;
            position: relative;
        }

        .package-features li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--venom-green);
            font-weight: bold;
        }

        .package-btn {
            background: linear-gradient(135deg, var(--venom-cyan), var(--venom-green));
            color: var(--venom-darker);
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .package-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 255, 135, 0.4);
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .metric-card {
            background: rgba(26, 45, 74, 0.4);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .metric-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--venom-green);
            margin-bottom: 5px;
        }

        .metric-label {
            font-size: 12px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Cost Comparison */
        .comparison-section {
            background: rgba(26, 45, 74, 0.4);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .comparison-section h2 {
            font-size: 18px;
            color: var(--venom-green);
            margin-bottom: 15px;
            text-align: center;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .comparison-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .comparison-label {
            font-size: 12px;
            color: #9ca3af;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .comparison-value {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .comparison-card.before .comparison-value {
            color: var(--venom-red);
        }

        .comparison-card.after .comparison-value {
            color: var(--venom-green);
        }

        .comparison-savings {
            font-size: 12px;
            color: var(--venom-green);
            font-weight: bold;
        }

        /* CTA Buttons */
        .cta-section {
            text-align: center;
            margin-top: 30px;
        }

        .cta-button {
            background: linear-gradient(135deg, var(--venom-green), var(--venom-cyan));
            color: var(--venom-darker);
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 135, 0.3);
        }

        .cta-button.secondary {
            background: transparent;
            border: 2px solid var(--venom-cyan);
            color: var(--venom-cyan);
        }

        .cta-button.secondary:hover {
            background: rgba(0, 217, 255, 0.1);
        }

        /* Urgency Banner */
        .urgency-banner {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(251, 191, 36, 0.2));
            border: 1px solid var(--venom-yellow);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
        }

        .urgency-banner h3 {
            font-size: 16px;
            color: var(--venom-yellow);
            margin-bottom: 8px;
        }

        .urgency-banner p {
            font-size: 13px;
            color: #e5e7eb;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 0 20px;
            color: #6b7280;
            font-size: 12px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                height: 100px;
            }

            .upload-zone {
                padding: 20px;
            }

            .packages-grid,
            .metrics-grid,
            .comparison-grid,
            .info-grid {
                grid-template-columns: 1fr;
            }

            .cta-button {
                display: block;
                margin: 10px 0;
            }
        }
    </style>
</head>

    <script>
        // === GOOGLE SATELLITE IMAGERY INTEGRATION ===
        function getGoogleSatelliteImage(address, lat, lon) {
            // Google Static Maps API (free tier: 28,000 loads/month)
            const zoom = 19; // Maximum zoom for satellite
            const size = '800x600';
            const maptype = 'satellite';
            
            // If you have a Google Maps API key, add it here: &key=YOUR_API_KEY
            // Without key: limited to 28k free requests/month
            const apiUrl = `https://maps.googleapis.com/maps/api/staticmap?center=${lat},${lon}&zoom=${zoom}&size=${size}&maptype=${maptype}&scale=2`;
            
            return apiUrl;
        }

        // === TERMINAL TYPEWRITER EFFECT ===
        let terminalLines = [];
        let currentLineIndex = 0;
        let isTyping = false;

        function addTerminalLine(text, type = 'output', delay = 0) {
            setTimeout(() => {
                const terminalBody = document.getElementById('terminalBody');
                const line = document.createElement('div');
                line.className = `terminal-line terminal-${type}`;
                
                if (type === 'prompt') {
                    line.innerHTML = `<span class="terminal-prompt">venom@parser:~$</span> <span class="terminal-command">${text}</span>`;
                } else {
                    line.textContent = text;
                }
                
                terminalBody.appendChild(line);
                terminalBody.scrollTop = terminalBody.scrollHeight;
            }, delay);
        }

        function typewriterEffect(text, element, speed = 30) {
            return new Promise((resolve) => {
                let i = 0;
                element.textContent = '';
                
                function type() {
                    if (i < text.length) {
                        element.textContent += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                
                type();
            });
        }

        async function runTerminalSequence(phases) {
            const terminalBody = document.getElementById('terminalBody');
            terminalBody.innerHTML = '';
            
            for (let i = 0; i < phases.length; i++) {
                const phase = phases[i];
                
                // Add prompt line
                addTerminalLine(phase.command, 'prompt', 0);
                
                await new Promise(resolve => setTimeout resolve, 300));
                
                // Add output line with typewriter effect
                const outputLine = document.createElement('div');
                outputLine.className = `terminal-line terminal-${phase.status}`;
                terminalBody.appendChild(outputLine);
                
                await typewriterEffect(phase.output, outputLine, 20);
                await new Promise(resolve => setTimeout(resolve, 400));
            }
            
            // Add cursor at end
            const cursorLine = document.createElement('div');
            cursorLine.className = 'terminal-line';
            cursorLine.innerHTML = '<span class="terminal-prompt">venom@parser:~$</span> <span class="terminal-cursor"></span>';
            terminalBody.appendChild(cursorLine);
        }

        // === FILE UPLOAD HANDLERS ===
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const terminalWindow = document.getElementById('terminalWindow');
        const progressContainer = document.getElementById('progressContainer');
        const proposalSection = document.getElementById('proposalSection');

        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                handleFileUpload(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFileUpload(file);
            }
        });

        async function handleFileUpload(file) {
            // Show terminal
            terminalWindow.classList.add('active');
            progressContainer.classList.add('active');
            
            // Terminal parsing sequence
            const phases = [
                { command: 'init --parse-bill', output: '[âœ"] Initializing VenomParser v11.5...', status: 'success' },
                { command: 'extract --customer-data', output: '[âœ"] Extracting customer information...', status: 'success' },
                { command: 'analyze --usage-patterns', output: '[âœ"] Analyzing energy usage patterns...', status: 'success' },
                { command: 'fetch --satellite-imagery', output: '[âœ"] Retrieving high-resolution satellite imagery...', status: 'success' },
                { command: 'calculate --solar-potential', output: '[âœ"] Calculating solar generation potential...', status: 'success' },
                { command: 'compute --rebates', output: '[âœ"] Computing Victorian rebates (STC, VEU, Solar Homes)...', status: 'success' },
                { command: 'generate --proposal', output: '[âœ"] Generating complete solar proposal...', status: 'success' },
                { command: 'render --visualization', output: '[âœ"] Rendering proposal with satellite visualization...', status: 'success' }
            ];
            
            // Run terminal sequence
            await runTerminalSequence(phases);
            
            // Update progress bar
            updateProgress(100);
            
            // Wait a moment then render proposal
            setTimeout(() => {
                renderProposal();
            }, 1000);
        }

        function updateProgress(percent) {
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            
            progressFill.style.width = `${percent}%`;
            progressText.textContent = `Processing... ${percent}%`;
            
            if (percent === 100) {
                progressText.textContent = 'Complete! Generating proposal...';
            }
        }

        function renderProposal() {
            // Sample data (replace with actual parsed data)
            const proposal = {
                customer: {
                    name: 'John Smith',
                    address: '123 Solar Street, Inverloch VIC 3996',
                    lat: -38.6369,
                    lon: 145.7247
                },
                usage: {
                    daily: 25,
                    quarterly: 2250,
                    cost: 675
                },
                systems: [
                    {
                        name: 'Standard',

                        price: 4990,
                        afterRebates: 2490,
                        features: ['16× 415W panels', 'Sungrow inverter', '10-year warranty', 'Free installation']
                    },
                    {
                        name: 'Recommended',
                        size: '10kW',
                        price: 6990,
                        afterRebates: 3990,
                        recommended: true,
                        features: ['24× 415W panels', 'Sungrow inverter', '15-year warranty', 'Battery-ready', 'Free monitoring']
                    },
                    {
                        name: 'Premium',
                        size: '13.2kW',
                        price: 8990,
                        afterRebates: 5490,
                        features: ['32× 415W panels', 'Premium inverter', '25-year warranty', 'Battery-ready', 'Premium support']
                    }
                ],
                savings: {
                    monthly: 225,
                    annually: 2700,
                    carbonOffset: 4.5
                }
            };

            // Build proposal HTML
            let html = `
                <!-- Customer Info Grid -->
                <div class="info-grid">
                    <div class="info-card">
                        <h3>Customer</h3>
                        <p><strong>${proposal.customer.name}</strong></p>
                        <p style="font-size: 12px; color: #9ca3af;">${proposal.customer.address}</p>
                    </div>
                    <div class="info-card">
                        <h3>Current Usage</h3>
                        <p><strong>${proposal.usage.daily} kWh/day</strong></p>
                        <p style="font-size: 12px; color: #9ca3af;">${proposal.usage.quarterly} kWh quarterly</p>
                    </div>
                    <div class="info-card">
                        <h3>Current Cost</h3>
                        <p><strong>$${proposal.usage.cost}/quarter</strong></p>

                <div class="urgency-banner">

                <div class="satellite-section">
                    <h2>ðŸ›° Your Property â€" Solar Potential Analysis</h2>

                        <div class="satellite-overlay">
                            <h3>${proposal.customer.address}</h3>

                    </div>
                </div>

                <!-- System Packages -->
                <div class="packages-section">
                    <h2>☀ï¸ Recommended Solar Systems</h2>
                    <div class="packages-grid">
            `;

            proposal.systems.forEach(system => {
                html += `
                    <div class="package-card ${system.recommended ? 'recommended' : ''}">
                        ${system.recommended ? '<span class="package-badge">Best Value</span>' : ''}

                        <div class="package-size">${system.size}</div>
                        <div class="package-price">
                            <span style="text-decoration: line-through; color: #6b7280;">$${system.price.toLocaleString()}</span>
                            <br>
                            <span style="font-size: 24px; color: var(--venom-green); font-weight: bold;">$${system.afterRebates.toLocaleString()}</span>
                            <br>
                            <span style="font-size: 12px;">after rebates</span>
                        </div>
                        <ul class="package-features">
                            ${system.features.map(f => `<li>${f}</li>`).join('')}
                        </ul>
                        <button class="package-btn">Get This System</button>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>

                <!-- Key Metrics -->
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-value">$${proposal.systems[1].afterRebates.toLocaleString()}</div>
                        <div class="metric-label">Out of Pocket</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">$${proposal.savings.monthly}</div>
                        <div class="metric-label">Monthly Savings</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${proposal.savings.carbonOffset}t</div>
                        <div class="metric-label">CO₂ Offset/Year</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">4.2yr</div>
                        <div class="metric-label">Payback Period</div>
                    </div>
                </div>

                <!-- Cost Comparison -->
                <div class="comparison-section">
                    <h2>💰 Your Monthly Energy Costs</h2>
                    <div class="comparison-grid">
                        <div class="comparison-card before">
                            <div class="comparison-label">Before Solar</div>
                            <div class="comparison-value">$${proposal.usage.cost}</div>
                            <div style="font-size: 12px; color: #9ca3af;">per quarter</div>
                        </div>
                        <div class="comparison-card after">
                            <div class="comparison-label">After Solar</div>
                            <div class="comparison-value">$${Math.max(0, proposal.usage.cost - proposal.savings.monthly * 3).toFixed(0)}</div>
                            <div class="comparison-savings">Save $${proposal.savings.monthly * 3}/quarter</div>
                        </div>
                    </div>
                </div>

                <!-- CTA -->
                <div class="cta-section">
                    <button class="cta-button">Book Free Consultation</button>
                    <button class="cta-button secondary">Download Full Proposal</button>
                </div>
            `;

            proposalSection.innerHTML = html;
            proposalSection.classList.add('active');
            
            // Scroll to proposal
            proposalSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
