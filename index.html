<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VenomProjects – Solar Proposal System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --venom-dark: #0a1628;
            --venom-darker: #05091a;
            --venom-blue: #1a2d4a;
            --venom-cyan: #00d9ff;
            --venom-green: #00ff87;
            --venom-green-dark: #00bf63;
            --venom-purple: #6366f1;
            --venom-red: #ef4444;
            --venom-yellow: #fbbf24;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--venom-darker) 0%, var(--venom-dark) 50%, var(--venom-blue) 100%);
            min-height: 100vh;
            color: #e5e7eb;
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .logo {
            height: 150px;
            width: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px rgba(0, 255, 135, 0.3));
        }

        .tagline {
            font-size: 14px;
            color: var(--venom-cyan);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .upload-section {
            background: rgba(26, 45, 74, 0.4);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .upload-zone {
            border: 2px dashed var(--venom-cyan);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 217, 255, 0.05);
        }

        .upload-zone:hover {
            border-color: var(--venom-green);
            background: rgba(0, 255, 135, 0.08);
            transform: translateY(-2px);
        }

        .upload-zone.dragover {
            border-color: var(--venom-green);
            background: rgba(0, 255, 135, 0.15);
        }

        .upload-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 14px;
            color: #9ca3af;
        }

        .upload-text strong {
            color: var(--venom-cyan);
            font-size: 15px;
        }

        #fileInput {
            display: none;
        }

        /* Terminal Window */
        .terminal-window {
            display: none;
            background: #000000;
            border: 1px solid var(--venom-cyan);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0, 217, 255, 0.2);
        }

        .terminal-window.active {
            display: block;
        }

        .terminal-header {
            background: linear-gradient(90deg, var(--venom-dark), var(--venom-blue));
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--venom-cyan);
        }

        .terminal-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-red { background: var(--venom-red); }
        .dot-yellow { background: var(--venom-yellow); }
        .dot-green { background: var(--venom-green); }

        .terminal-title {
            margin-left: 10px;
            font-size: 12px;
            color: var(--venom-cyan);
            font-family: 'Courier New', monospace;
        }

        .terminal-body {
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.8;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }

        .terminal-line {
            margin-bottom: 5px;
            animation: fadeInUp 0.3s ease;
        }

        .terminal-prompt {
            color: var(--venom-green);
        }

        .terminal-command {
            color: var(--venom-cyan);
        }

        .terminal-success {
            color: var(--venom-green);
        }

        .terminal-cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--venom-green);
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-container {
            display: none;
            margin-bottom: 25px;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar-wrapper {
            background: rgba(26, 45, 74, 0.4);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid rgba(0, 217, 255, 0.2);
        }

        .progress-bar {
            height: 4px;
            background: rgba(0, 217, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--venom-cyan), var(--venom-green));
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--venom-cyan);
        }

        .progress-text {
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
        }

        /* Proposal - Keep your existing styles from integration */
        .proposal {
            display: none;
        }

        .proposal.active {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        footer {
            text-align: center;
            padding: 30px 0 20px;
            color: #6b7280;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .logo {
                height: 100px;
            }
            .upload-zone {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="assets/VenomProjectsBig.png" alt="VenomProjects" class="logo" onerror="this.style.display='none'">
            <p class="tagline">Next-Gen Solar Proposal System</p>
        </header>

        <div class="upload-section">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon">📄</div>
                <p class="upload-text">
                    <strong>Drop your electricity bill here</strong><br>
                    or click to browse (PDF format)
                </p>
            </div>
            <input type="file" id="fileInput" accept=".pdf">
        </div>

        <!-- Terminal Window -->
        <div class="terminal-window" id="terminalWindow">
            <div class="terminal-header">
                <span class="terminal-dot dot-red"></span>
                <span class="terminal-dot dot-yellow"></span>
                <span class="terminal-dot dot-green"></span>
                <span class="terminal-title">VenomParser v11.5 – Bill Analysis Engine</span>
            </div>
            <div class="terminal-body" id="terminalBody"></div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-wrapper">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text" id="progressText">Initializing...</p>
            </div>
        </div>

        <!-- Proposal (rendered by your existing integration) -->
        <div class="proposal" id="proposalSection"></div>

        <footer>
            <p>&copy; 2025 VenomProjects – Powered by AI & Innovation</p>
        </footer>
    </div>

    <!-- YOUR EXISTING FILES -->
    <script src="venomparser-v11.5-enhanced.js"></script>
    <script src="rebate-calculator.js"></script>
    <script src="venomvision-mvp.js"></script>
    <script src="venomprojects-complete-integration.js"></script>

    <script>
        console.log('🔥 VenomParser Elite v12.0 - Integrated');
        
        // === ELITE TERMINAL UI WRAPPER ===
        async function typewriterEffect(text, element, speed = 20) {
            return new Promise((resolve) => {
                let i = 0;
                element.textContent = '';
                
                function type() {
                    if (i < text.length) {
                        element.textContent += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        async function runTerminalSequence() {
            const terminalBody = document.getElementById('terminalBody');
            terminalBody.innerHTML = '';
            
            const phases = [
                { command: 'init --parse-bill', output: '[✓] Initializing VenomParser v11.5...' },
                { command: 'extract --customer-data', output: '[✓] Extracting customer information...' },
                { command: 'analyze --usage-patterns', output: '[✓] Analyzing energy usage patterns...' },
                { command: 'fetch --satellite-imagery', output: '[✓] Retrieving satellite imagery...' },
                { command: 'calculate --solar-potential', output: '[✓] Calculating solar generation potential...' },
                { command: 'compute --rebates', output: '[✓] Computing Victorian rebates...' },
                { command: 'generate --proposal', output: '[✓] Generating complete proposal...' },
                { command: 'render --visualization', output: '[✓] Rendering proposal...' }
            ];
            
            for (let i = 0; i < phases.length; i++) {
                const phase = phases[i];
                
                // Prompt line
                const promptLine = document.createElement('div');
                promptLine.className = 'terminal-line';
                promptLine.innerHTML = `<span class="terminal-prompt">venom@parser:~$</span> <span class="terminal-command">${phase.command}</span>`;
                terminalBody.appendChild(promptLine);
                
                await new Promise(resolve => setTimeout(resolve, 150));
                
                // Output line
                const outputLine = document.createElement('div');
                outputLine.className = 'terminal-line terminal-success';
                terminalBody.appendChild(outputLine);
                
                await typewriterEffect(phase.output, outputLine, 15);
                await new Promise(resolve => setTimeout(resolve, 200));
                
                terminalBody.scrollTop = terminalBody.scrollHeight;
                
                // Update progress
                updateProgress(((i + 1) / phases.length) * 100);
            }
            
            // Cursor
            const cursorLine = document.createElement('div');
            cursorLine.className = 'terminal-line';
            cursorLine.innerHTML = '<span class="terminal-prompt">venom@parser:~$</span> <span class="terminal-cursor"></span>';
            terminalBody.appendChild(cursorLine);
        }

        function updateProgress(percent) {
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            
            progressFill.style.width = `${percent}%`;
            progressText.textContent = `Processing... ${Math.round(percent)}%`;
            
            if (percent === 100) {
                progressText.textContent = 'Complete! Generating proposal...';
            }
        }

        // === WRAP YOUR EXISTING FILE HANDLER ===
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const terminalWindow = document.getElementById('terminalWindow');
        const progressContainer = document.getElementById('progressContainer');
        const proposalSection = document.getElementById('proposalSection');

        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                handleEliteFileUpload(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleEliteFileUpload(file);
            }
        });

        async function handleEliteFileUpload(file) {
            console.log('🚀 Elite upload started for:', file.name);
            
            // Show elite terminal UI
            terminalWindow.classList.add('active');
            progressContainer.classList.add('active');
            
            // Run terminal animation
            const terminalPromise = runTerminalSequence();
            
            // Run YOUR ACTUAL PARSER in parallel
            // This calls your existing venomprojects-complete-integration.js
            try {
                // Your integration file should expose a function like this:
                // processCompleteProposal(file) or handleBillUpload(file)
                
                // Try to detect and call your existing function
                if (typeof window.processCompleteProposal === 'function') {
                    console.log('✅ Found processCompleteProposal function');
                    await Promise.all([terminalPromise, window.processCompleteProposal(file)]);
                } else if (typeof window.handleBillUpload === 'function') {
                    console.log('✅ Found handleBillUpload function');
                    await Promise.all([terminalPromise, window.handleBillUpload(file)]);
                } else {
                    // Fallback: let your existing code handle it
                    console.log('⚠️ No recognized function found, triggering manual upload');
                    await terminalPromise;
                    
                    // Trigger your existing file handler
                    const event = new Event('change', { bubbles: true });
                    const originalInput = document.querySelector('input[type="file"]:not(#fileInput)');
                    if (originalInput) {
                        const dataTransfer = new DataTransfer();
                        dataTransfer.items.add(file);
                        originalInput.files = dataTransfer.files;
                        originalInput.dispatchEvent(event);
                    }
                }
                
                console.log('✅ Processing complete');
                
                // Show proposal section
                setTimeout(() => {
                    proposalSection.classList.add('active');
                    proposalSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 500);
                
            } catch (error) {
                console.error('❌ Error processing bill:', error);
                alert('Error processing bill. Check console for details.');
            }
        }

        console.log('✅ Elite UI initialized - ready for bill upload');
    </script>
</body>
</html>
