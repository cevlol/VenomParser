<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VenomProjects Complete - Solar Proposal System Demo</title>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #132940 50%, #0a1929 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #1a202c;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Header */
        .demo-header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .demo-header h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .demo-header p {
            font-size: 20px;
            opacity: 0.95;
        }
        
        /* Upload Section */
        .upload-section {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 40px;
        }
        
        .upload-zone {
            border: 3px dashed #cbd5e0;
            border-radius: 15px;
            padding: 60px 40px;
            cursor: pointer;
            transition: all 0.3s;
            background: #f7fafc;
        }
        
        .upload-zone:hover {
            border-color: #00d9ff;
            background: #edf2f7;
        }
        
        .upload-zone.dragover {
            border-color: #00d9ff;
            background: #e6fffa;
            transform: scale(1.02);
        }
        
        .upload-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .upload-zone h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #2d3748;
        }
        
        .upload-zone p {
            color: #718096;
            margin-bottom: 20px;
        }
        
        .btn-upload {
            background: linear-gradient(135deg, #00d9ff 0%, #00d744 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn-upload:hover {
            transform: translateY(-2px);
        }
        
        #fileInput {
            display: none;
        }
        
        /* Progress Section */
        .progress-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: none;
        }
        
        .progress-section.active {
            display: block;
        }
        
        .progress-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .progress-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .progress-phase {
            font-size: 20px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
        }
        
        .progress-bar-container {
            background: #e2e8f0;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-bar {
            background: linear-gradient(90deg, #00d9ff 0%, #00d744 100%);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .progress-percent {
            text-align: center;
            color: #718096;
            font-size: 14px;
        }
        
        /* Proposal Section */
        .proposal-container {
            display: none;
        }
        
        .proposal-container.active {
            display: block;
        }
        
        .venom-proposal-complete {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .section {
            padding: 40px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .section:last-child {
            border-bottom: none;
        }
        
        .section h3 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #2d3748;
        }
        
        /* Header Section */
        .proposal-header {
            background: linear-gradient(135deg, #00d9ff 0%, #00d744 100%);
            color: white;
            padding: 60px 40px;
            text-align: center;
        }
        
        .proposal-header h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }
        
        .customer-info h2 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .customer-info p {
            font-size: 18px;
            opacity: 0.9;
        }
        
        /* Current Costs */
        .cost-display.pain {
            background: linear-gradient(135deg, #fc8181 0%, #f56565 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
        }
        
        .big-number {
            font-size: 56px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        
        .annual-cost {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .daily-usage {
            font-size: 16px;
            opacity: 0.9;
        }
        
        /* Satellite Section */
        .satellite-image-container {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .satellite-main {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .system-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .system-overlay strong {
            display: block;
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .system-overlay span {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .view-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .btn-view {
            padding: 12px 30px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-view.active {
            background: linear-gradient(135deg, #00d9ff 0%, #00d744 100%);
            color: white;
            border-color: transparent;
        }
        
        .btn-view:hover {
            transform: translateY(-2px);
        }
        
        /* Cost Breakdown */
        .cost-breakdown {
            background: #f7fafc;
            padding: 30px;
            border-radius: 15px;
        }
        
        .cost-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .cost-line:last-child {
            border-bottom: none;
        }
        
        .cost-line.system-cost {
            font-size: 18px;
        }
        
        .cost-line.rebate {
            color: #38a169;
        }
        
        .cost-line.rebate.highlight {
            background: #f0fff4;
            margin: 10px -15px;
            padding: 15px;
            border-radius: 10px;
        }
        
        .cost-line.total {
            border-top: 3px solid #2d3748;
            font-size: 24px;
            padding-top: 20px;
            margin-top: 10px;
        }
        
        .cost-line small {
            display: block;
            font-size: 13px;
            opacity: 0.8;
            margin-top: 3px;
        }
        
        .cost-line .urgent {
            color: #e53e3e;
            font-weight: 600;
        }
        
        .amount {
            font-weight: 700;
            white-space: nowrap;
        }
        
        .amount.green {
            color: #38a169;
        }
        
        .amount.huge {
            font-size: 32px;
            color: #00d9ff;
        }
        
        .financing-options {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            text-align: center;
        }
        
        .payment-option {
            font-size: 20px;
            margin-bottom: 10px;
        }
        
        .loan-option {
            font-size: 16px;
            color: #00d9ff;
        }
        
        /* Savings Grid */
        .savings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .savings-card {
            background: #f7fafc;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s;
        }
        
        .savings-card:hover {
            transform: translateY(-5px);
        }
        
        .savings-card.highlight {
            background: linear-gradient(135deg, #00d9ff 0%, #00d744 100%);
            color: white;
        }
        
        .savings-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        
        .savings-value {
            font-size: 36px;
            font-weight: 800;
        }
        
        .insight-box {
            background: #e6fffa;
            border-left: 4px solid #38b2ac;
            padding: 20px;
            border-radius: 10px;
        }
        
        .insight-main {
            font-size: 18px;
            line-height: 1.6;
        }
        
        /* Urgency Section */
        .urgency-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: #fff5f5;
            border-left: 4px solid #fc8181;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .urgency-item.high {
            background: #fff5f5;
            border-color: #fc8181;
        }
        
        .urgency-item.medium {
            background: #fffaf0;
            border-color: #ed8936;
        }
        
        .urgency-icon {
            font-size: 32px;
        }
        
        .urgency-content strong {
            display: block;
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .urgency-content p {
            font-size: 14px;
            color: #718096;
        }
        
        /* CTA Section */
        .cta-section {
            text-align: center;
            background: linear-gradient(135deg, #00d9ff 0%, #00d744 100%);
            color: white;
        }
        
        .cta-button {
            background: white;
            color: #00d9ff;
            border: none;
            padding: 20px 60px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .cta-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .cta-button.pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .cta-subtext {
            font-size: 18px;
            margin-bottom: 10px;
            opacity: 0.95;
        }
        
        .cta-payment {
            font-size: 16px;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        
        .cta-trust {
            font-size: 14px;
            opacity: 0.8;
        }
        
        /* Error Section */
        .error-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: none;
        }
        
        .error-section.active {
            display: block;
        }
        
        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .error-section h3 {
            font-size: 24px;
            color: #e53e3e;
            margin-bottom: 10px;
        }
        
        .error-section p {
            color: #718096;
            margin-bottom: 20px;
        }
        
        .btn-retry {
            background: #00d9ff;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .demo-header h1 {
                font-size: 32px;
            }
            
            .upload-section {
                padding: 40px 20px;
            }
            
            .section {
                padding: 30px 20px;
            }
            
            .big-number {
                font-size: 40px;
            }
            
            .savings-grid {
                grid-template-columns: 1fr;
            }
        }
        
        /* ============================================
           ENHANCED UI - PACKAGES & METRICS
           ============================================ */
        
        /* System Packages Grid */
        .packages-section {
            margin: 40px 0;
        }
        
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .package-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 217, 255, 0.2);
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        
        .package-card:hover {
            transform: translateY(-4px);
            border-color: #00d9ff;
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.3);
        }
        
        .package-card.recommended {
            border-color: #00d744;
            background: rgba(0, 215, 68, 0.08);
        }
        
        .package-badge {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            padding: 4px 16px;
            background: #00d744;
            color: #0a1929;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .package-name {
            font-size: 18px;
            color: #00d9ff;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .package-size {
            font-size: 42px;
            font-weight: 800;
            color: white;
            margin-bottom: 5px;
        }
        
        .package-panels {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 20px;
        }
        
        .package-price {
            font-size: 36px;
            font-weight: 800;
            color: #00d744;
            margin: 20px 0 10px;
        }
        
        .package-roi {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }
        
        .btn-select-package {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d744 0%, #00d9ff 100%);
            color: #0a1929;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-select-package:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 215, 68, 0.5);
        }
        
        /* Key Metrics Grid */
        .metrics-section {
            margin: 40px 0;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .metric-card {
            background: linear-gradient(135deg, rgba(0, 215, 68, 0.05) 0%, rgba(0, 217, 255, 0.05) 100%);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .metric-card:hover {
            transform: translateY(-4px);
            border-color: #00d9ff;
            box-shadow: 0 8px 25px rgba(0, 217, 255, 0.2);
        }
        
        .metric-icon {
            font-size: 36px;
            margin-bottom: 15px;
            opacity: 0.9;
        }
        
        .metric-value {
            font-size: 40px;
            font-weight: 800;
            color: #00d9ff;
            margin-bottom: 8px;
            line-height: 1;
        }
        
        .metric-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Cost Comparison */
        .comparison-section {
            margin: 40px 0;
        }
        
        .cost-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .cost-column {
            text-align: center;
            padding: 40px 30px;
        }
        
        .cost-column.before {
            border-right: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(252, 129, 129, 0.05);
        }
        
        .cost-column.after {
            background: rgba(0, 215, 68, 0.05);
        }
        
        .cost-column h4 {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .cost-column .big-amount {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1;
        }
        
        .cost-column.before .big-amount {
            color: #fc8181;
        }
        
        .cost-column.after .big-amount {
            color: #00d744;
        }
        
        .cost-column .period {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .cost-column .savings-note {
            margin-top: 15px;
            font-size: 13px;
            color: #00d9ff;
            font-weight: 600;
        }
        
        /* What's Included */
        .included-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
        }
        
        .included-section h3 {
            font-size: 20px;
            color: #00d9ff;
            margin-bottom: 20px;
        }
        
        .included-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }
        
        .included-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
        }
        
        .included-item .icon {
            font-size: 20px;
            color: #00d744;
            flex-shrink: 0;
        }
        
        .included-item .text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.4;
        }
        
        /* Enhanced Responsive */
        @media (max-width: 768px) {
            .packages-grid {
                grid-template-columns: 1fr;
            }
            
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .cost-comparison {
                grid-template-columns: 1fr;
            }
            
            .cost-column.before {
                border-right: none;
                border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            }
            
            .included-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 480px) {
            .metrics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    
    <div class="container">
        
        <!-- Header -->
        <div class="demo-header">
            <img src="assets/VenomProjectsBig.png" alt="VenomProjects" style="height: 60px; margin-bottom: 20px; filter: drop-shadow(0 0 20px rgba(0, 215, 68, 0.3));">
            <h1>Solar Proposal System</h1>
            <p>Advanced bill analysis with satellite imagery and Victorian rebate calculations</p>
        </div>
        
        <!-- Upload Section -->
        <div class="upload-section">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon">📄</div>
                <h3>Upload Your Electricity Bill</h3>
                <p>Drop your PDF here or click to browse</p>
                <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
                    Choose File
                </button>
                <input type="file" id="fileInput" accept=".pdf" onchange="handleFileUpload(event)">
            </div>
        </div>
        
        <!-- Progress Section -->
        <div class="progress-section" id="progressSection">
            <div class="progress-header">
                <div class="progress-icon" id="progressIcon">⏳</div>
                <div class="progress-phase" id="progressPhase">Processing...</div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>
        
        <!-- Error Section -->
        <div class="error-section" id="errorSection">
            <div class="error-icon">❌</div>
            <h3>Processing Failed</h3>
            <p id="errorMessage">Something went wrong</p>
            <button class="btn-retry" onclick="resetUpload()">Try Again</button>
        </div>
        
        <!-- Proposal Section -->
        <div class="proposal-container" id="proposalContainer"></div>
        
    </div>
    
    <!-- Load Scripts -->
    <script src="rebate-calculator.js"></script>
    <script src="venomvision-mvp.js"></script>
    <script src="venomparser-v11.5-enhanced.js"></script>
    <script src="venomprojects-complete-integration.js"></script>
    
    <script>
        // Configuration
        const CONFIG = {
            // Add your API keys here
            googleApiKey: null,  // Get from: https://console.cloud.google.com/
            mapboxToken: null    // Get from: https://account.mapbox.com/
        };
        
        // Initialize system on page load
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Initializing VenomProjects Complete System...');
            initializeVenomSystem(CONFIG);
        });
        
        // Drag and drop handlers
        const uploadZone = document.getElementById('uploadZone');
        
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type === 'application/pdf') {
                processFile(files[0]);
            } else {
                alert('Please drop a PDF file');
            }
        });
        
        // File upload handler
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                processFile(file);
            }
        }
        
        // Process file
        function processFile(file) {
            console.log('📄 Processing file:', file.name);
            
            // Hide upload, show progress
            document.querySelector('.upload-section').style.display = 'none';
            document.getElementById('progressSection').classList.add('active');
            document.getElementById('errorSection').classList.remove('active');
            document.getElementById('proposalContainer').classList.remove('active');
            
            // Process with complete system
            processBillComplete(
                file,
                onProgress,
                onComplete,
                onError
            );
        }
        
        // Progress callback
        function onProgress(progress) {
            const icon = document.getElementById('progressIcon');
            const phase = document.getElementById('progressPhase');
            const bar = document.getElementById('progressBar');
            const percent = document.getElementById('progressPercent');
            
            icon.textContent = progress.icon || '⏳';
            phase.textContent = progress.phase;
            bar.style.width = progress.progress + '%';
            percent.textContent = progress.progress + '%';
        }
        
        // Enhance proposal with packages, metrics, and comparisons
        function enhanceProposalUI(proposal) {
            console.log('🎨 Enhancing proposal UI...', proposal);
            
            const container = document.getElementById('proposalContainer');
            const proposalElem = container.querySelector('.proposal');
            
            if (!proposalElem) {
                console.warn('⚠️ No proposal element found');
                return;
            }
            
            console.log('✓ Found proposal element');
            
            // Find the best insertion point - look for multiple possible sections
            const sections = proposalElem.querySelectorAll('.section');
            console.log(`✓ Found ${sections.length} sections`);
            
            let insertAfter = null;
            
            // Try to find satellite/roof section
            sections.forEach(section => {
                const h3 = section.querySelector('h3');
                if (h3 && (h3.textContent.includes('Roof') || h3.textContent.includes('Solar'))) {
                    insertAfter = section;
                }
            });
            
            // Fallback: insert after first section (usually current costs)
            if (!insertAfter && sections.length > 0) {
                insertAfter = sections[0];
            }
            
            // Calculate recommended system sizes based on usage
            const currentUsage = proposal.billData?.usage || 15; // kWh/day
            const annualUsage = currentUsage * 365;
            
            const packages = [
                {
                    name: 'Standard',
                    size: '6.6kW',
                    panels: '18 × 370W panels',
                    production: Math.round(annualUsage * 0.8),
                    price: proposal.systemCost || 11000,
                    rebates: proposal.totalRebates || 7680,
                    roi: '2.5 years',
                    recommended: annualUsage < 8000
                },
                {
                    name: 'Recommended',
                    size: '10kW',
                    panels: '27 × 370W panels',
                    production: Math.round(annualUsage * 1.2),
                    price: Math.round((proposal.systemCost || 11000) * 1.4),
                    rebates: Math.round((proposal.totalRebates || 7680) * 1.3),
                    roi: '2.8 years',
                    recommended: annualUsage >= 8000 && annualUsage <= 15000
                },
                {
                    name: 'Premium',
                    size: '13.2kW',
                    panels: '36 × 370W panels',
                    production: Math.round(annualUsage * 1.6),
                    price: Math.round((proposal.systemCost || 11000) * 1.8),
                    rebates: Math.round((proposal.totalRebates || 7680) * 1.5),
                    roi: '3.1 years',
                    recommended: annualUsage > 15000
                }
            ];
            
            // Build packages HTML
            const packagesHTML = `
                <div class="section packages-section">
                    <h3>⚡ Choose Your System Size</h3>
                    <div class="packages-grid">
                        ${packages.map(pkg => `
                            <div class="package-card ${pkg.recommended ? 'recommended' : ''}">
                                ${pkg.recommended ? '<div class="package-badge">Best Match</div>' : ''}
                                <div class="package-name">${pkg.name}</div>
                                <div class="package-size">${pkg.size}</div>
                                <div class="package-panels">${pkg.panels}</div>
                                <div class="package-price">$${(pkg.price - pkg.rebates).toLocaleString()}</div>
                                <div class="package-roi">Payback: ${pkg.roi}</div>
                                <div style="font-size: 13px; color: rgba(255,255,255,0.6); margin: 10px 0;">
                                    Produces ~${pkg.production.toLocaleString()} kWh/year
                                </div>
                                <button class="btn-select-package" onclick="alert('Contact us to proceed with ${pkg.size} system')">
                                    Select ${pkg.size}
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            // Build metrics HTML
            const outOfPocket = (proposal.systemCost || 11000) - (proposal.totalRebates || 7680);
            const energyIndependence = Math.min(95, Math.round((proposal.billData?.usage || 15) * 0.87));
            const carbonOffset = Math.round((proposal.billData?.usage || 15) * 365 * 0.7 / 21);  // trees equivalent
            const payback = proposal.savings?.payback || 2.5;
            
            const metricsHTML = `
                <div class="section metrics-section">
                    <h3>📊 Key Benefits</h3>
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <div class="metric-icon">💰</div>
                            <div class="metric-value">$${outOfPocket.toLocaleString()}</div>
                            <div class="metric-label">Out of Pocket</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-icon">⚡</div>
                            <div class="metric-value">${energyIndependence}%</div>
                            <div class="metric-label">Energy Independent</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-icon">🌱</div>
                            <div class="metric-value">${carbonOffset}</div>
                            <div class="metric-label">Trees Planted Equivalent</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-icon">📅</div>
                            <div class="metric-value">${payback}</div>
                            <div class="metric-label">Years to Payback</div>
                        </div>
                    </div>
                </div>
            `;
            
            // Build cost comparison HTML
            const quarterlyBefore = proposal.billData?.billAmount || 507;
            const monthlyBefore = Math.round(quarterlyBefore / 3);
            const weeklyAfter = Math.round(outOfPocket / 52 / 5); // 5 year finance estimate
            const monthlySavings = Math.round((proposal.savings?.annual || 5000) / 12);
            
            const comparisonHTML = `
                <div class="section comparison-section">
                    <h3>💵 Your New Reality</h3>
                    <div class="cost-comparison">
                        <div class="cost-column before">
                            <h4>Without Solar</h4>
                            <div class="big-amount">$${monthlyBefore}</div>
                            <div class="period">per month</div>
                        </div>
                        <div class="cost-column after">
                            <h4>With Solar</h4>
                            <div class="big-amount">$${weeklyAfter}</div>
                            <div class="period">per week (financed)</div>
                            <div class="savings-note">Save $${monthlySavings}/month on bills</div>
                        </div>
                    </div>
                </div>
            `;
            
            // Build what's included HTML
            const includedHTML = `
                <div class="section included-section">
                    <h3>✓ What's Included</h3>
                    <div class="included-grid">
                        <div class="included-item">
                            <div class="icon">✓</div>
                            <div class="text"><strong>10-year warranty</strong><br>Full workmanship guarantee</div>
                        </div>
                        <div class="included-item">
                            <div class="icon">✓</div>
                            <div class="text"><strong>CEC certified installer</strong><br>Fully accredited professionals</div>
                        </div>
                        <div class="included-item">
                            <div class="icon">✓</div>
                            <div class="text"><strong>All rebates handled</strong><br>We manage VEU, STC, Solar Vic</div>
                        </div>
                        <div class="included-item">
                            <div class="icon">✓</div>
                            <div class="text"><strong>Quick installation</strong><br>Installed in 2-4 weeks</div>
                        </div>
                    </div>
                </div>
            `;
            
            // Insert sections after the appropriate location
            if (insertAfter) {
                console.log('✓ Inserting enhanced sections after:', insertAfter);
                insertAfter.insertAdjacentHTML('afterend', packagesHTML + metricsHTML + comparisonHTML + includedHTML);
                console.log('✅ Enhanced sections inserted successfully');
            } else {
                console.warn('⚠️ No insertion point found, using fallback');
                // Fallback: insert at beginning of proposal
                const firstSection = proposalElem.querySelector('.section');
                if (firstSection) {
                    firstSection.insertAdjacentHTML('afterend', packagesHTML + metricsHTML + comparisonHTML + includedHTML);
                    console.log('✅ Enhanced sections inserted (fallback)');
                }
            }
        }
        
        // Complete callback
        function onComplete(proposal) {
            console.log('✅ Proposal complete:', proposal);
            
            // Hide progress, show proposal
            document.getElementById('progressSection').classList.remove('active');
            document.getElementById('proposalContainer').classList.add('active');
            
            // Render proposal
            renderCompleteProposal(proposal, 'proposalContainer');
            
            // Enhance proposal with new sections (with delay to ensure DOM is ready)
            setTimeout(() => {
                enhanceProposalUI(proposal);
            }, 200);
            
            // Scroll to proposal
            setTimeout(() => {
                document.getElementById('proposalContainer').scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }, 500);
        }
        
        // Error callback
        function onError(error) {
            console.error('❌ Error:', error);
            
            // Hide progress, show error
            document.getElementById('progressSection').classList.remove('active');
            document.getElementById('errorSection').classList.add('active');
            document.getElementById('errorMessage').textContent = error.message;
        }
        
        // Reset upload
        function resetUpload() {
            document.querySelector('.upload-section').style.display = 'block';
            document.getElementById('errorSection').classList.remove('active');
            document.getElementById('proposalContainer').classList.remove('active');
            document.getElementById('fileInput').value = '';
        }
    </script>
    
</body>
</html>
