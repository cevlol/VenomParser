<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VenomProjects Complete - Solar Proposal System Demo</title>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #132940 50%, #0a1929 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #1a202c;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Header */
        .demo-header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .demo-header h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .demo-header p {
            font-size: 20px;
            opacity: 0.95;
        }
        
        /* Upload Section */
        .upload-section {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 40px;
        }
        
        .upload-zone {
            border: 3px dashed #cbd5e0;
            border-radius: 15px;
            padding: 60px 40px;
            cursor: pointer;
            transition: all 0.3s;
            background: #f7fafc;
        }
        
        .upload-zone:hover {
            border-color: #00d9ff;
            background: #edf2f7;
        }
        
        .upload-zone.dragover {
            border-color: #00d9ff;
            background: #e6fffa;
            transform: scale(1.02);
        }
        
        .upload-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .upload-zone h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #2d3748;
        }
        
        .upload-zone p {
            color: #718096;
            margin-bottom: 20px;
        }
        
        .btn-upload {
            background: linear-gradient(135deg, #00d9ff 0%, #00d744 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn-upload:hover {
            transform: translateY(-2px);
        }
        
        #fileInput {
            display: none;
        }
        
        /* Progress Section */
        .progress-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: none;
        }
        
        .progress-section.active {
            display: block;
        }
        
        .progress-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .progress-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .progress-phase {
            font-size: 20px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
        }
        
        .progress-bar-container {
            background: #e2e8f0;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-bar {
            background: linear-gradient(90deg, #00d9ff 0%, #00d744 100%);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }
        
        .progress-percent {
            text-align: center;
            color: #718096;
            font-size: 14px;
        }
        
        /* Proposal Section */
        .proposal-container {
            display: none;
        }
        
        .proposal-container.active {
            display: block;
        }
        
        .venom-proposal-complete {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .section {
            padding: 40px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .section:last-child {
            border-bottom: none;
        }
        
        .section h3 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #2d3748;
        }
        
        /* Header Section */
        .proposal-header {
            background: linear-gradient(135deg, #00d9ff 0%, #00d744 100%);
            color: white;
            padding: 60px 40px;
            text-align: center;
        }
        
        .proposal-header h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }
        
        .customer-info h2 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .customer-info p {
            font-size: 18px;
            opacity: 0.9;
        }
        
        /* Current Costs */
        .cost-display.pain {
            background: linear-gradient(135deg, #fc8181 0%, #f56565 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
        }
        
        .big-number {
            font-size: 56px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        
        .annual-cost {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .daily-usage {
            font-size: 16px;
            opacity: 0.9;
        }
        
        /* Satellite Section */
        .satellite-image-container {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .satellite-main {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .system-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .system-overlay strong {
            display: block;
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .system-overlay span {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .view-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .btn-view {
            padding: 12px 30px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-view.active {
            background: linear-gradient(135deg, #00d9ff 0%, #00d744 100%);
            color: white;
            border-color: transparent;
        }
        
        .btn-view:hover {
            transform: translateY(-2px);
        }
        
        /* Cost Breakdown */
        .cost-breakdown {
            background: #f7fafc;
            padding: 30px;
            border-radius: 15px;
        }
        
        .cost-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .cost-line:last-child {
            border-bottom: none;
        }
        
        .cost-line.system-cost {
            font-size: 18px;
        }
        
        .cost-line.rebate {
            color: #38a169;
        }
        
        .cost-line.rebate.highlight {
            background: #f0fff4;
            margin: 10px -15px;
            padding: 15px;
            border-radius: 10px;
        }
        
        .cost-line.total {
            border-top: 3px solid #2d3748;
            font-size: 24px;
            padding-top: 20px;
            margin-top: 10px;
        }
        
        .cost-line small {
            display: block;
            font-size: 13px;
            opacity: 0.8;
            margin-top: 3px;
        }
        
        .cost-line .urgent {
            color: #e53e3e;
            font-weight: 600;
        }
        
        .amount {
            font-weight: 700;
            white-space: nowrap;
        }
        
        .amount.green {
            color: #38a169;
        }
        
        .amount.huge {
            font-size: 32px;
            color: #00d9ff;
        }
        
        .financing-options {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            text-align: center;
        }
        
        .payment-option {
            font-size: 20px;
            margin-bottom: 10px;
        }
        
        .loan-option {
            font-size: 16px;
            color: #00d9ff;
        }
        
        /* Savings Grid */
        .savings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .savings-card {
            background: #f7fafc;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s;
        }
        
        .savings-card:hover {
            transform: translateY(-5px);
        }
        
        .savings-card.highlight {
            background: linear-gradient(135deg, #00d9ff 0%, #00d744 100%);
            color: white;
        }
        
        .savings-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        
        .savings-value {
            font-size: 36px;
            font-weight: 800;
        }
        
        .insight-box {
            background: #e6fffa;
            border-left: 4px solid #38b2ac;
            padding: 20px;
            border-radius: 10px;
        }
        
        .insight-main {
            font-size: 18px;
            line-height: 1.6;
        }
        
        /* Urgency Section */
        .urgency-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: #fff5f5;
            border-left: 4px solid #fc8181;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .urgency-item.high {
            background: #fff5f5;
            border-color: #fc8181;
        }
        
        .urgency-item.medium {
            background: #fffaf0;
            border-color: #ed8936;
        }
        
        .urgency-icon {
            font-size: 32px;
        }
        
        .urgency-content strong {
            display: block;
            font-size: 18px;
            margin-bottom: 5px;
        }
        
        .urgency-content p {
            font-size: 14px;
            color: #718096;
        }
        
        /* CTA Section */
        .cta-section {
            text-align: center;
            background: linear-gradient(135deg, #00d9ff 0%, #00d744 100%);
            color: white;
        }
        
        .cta-button {
            background: white;
            color: #00d9ff;
            border: none;
            padding: 20px 60px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .cta-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .cta-button.pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .cta-subtext {
            font-size: 18px;
            margin-bottom: 10px;
            opacity: 0.95;
        }
        
        .cta-payment {
            font-size: 16px;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        
        .cta-trust {
            font-size: 14px;
            opacity: 0.8;
        }
        
        /* Error Section */
        .error-section {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: none;
        }
        
        .error-section.active {
            display: block;
        }
        
        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .error-section h3 {
            font-size: 24px;
            color: #e53e3e;
            margin-bottom: 10px;
        }
        
        .error-section p {
            color: #718096;
            margin-bottom: 20px;
        }
        
        .btn-retry {
            background: #00d9ff;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .demo-header h1 {
                font-size: 32px;
            }
            
            .upload-section {
                padding: 40px 20px;
            }
            
            .section {
                padding: 30px 20px;
            }
            
            .big-number {
                font-size: 40px;
            }
            
            .savings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    
    <div class="container">
        
        <!-- Header -->
        <div class="demo-header">
            <img src="assets/VenomProjectsBig.png" alt="VenomProjects" style="height: 60px; margin-bottom: 20px; filter: drop-shadow(0 0 20px rgba(0, 215, 68, 0.3));">
            <h1>Solar Proposal System</h1>
            <p>Advanced bill analysis with satellite imagery and Victorian rebate calculations</p>
        </div>
        
        <!-- Upload Section -->
        <div class="upload-section">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon">📄</div>
                <h3>Upload Your Electricity Bill</h3>
                <p>Drop your PDF here or click to browse</p>
                <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
                    Choose File
                </button>
                <input type="file" id="fileInput" accept=".pdf" onchange="handleFileUpload(event)">
            </div>
        </div>
        
        <!-- Progress Section -->
        <div class="progress-section" id="progressSection">
            <div class="progress-header">
                <div class="progress-icon" id="progressIcon">⏳</div>
                <div class="progress-phase" id="progressPhase">Processing...</div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>
        
        <!-- Error Section -->
        <div class="error-section" id="errorSection">
            <div class="error-icon">❌</div>
            <h3>Processing Failed</h3>
            <p id="errorMessage">Something went wrong</p>
            <button class="btn-retry" onclick="resetUpload()">Try Again</button>
        </div>
        
        <!-- Proposal Section -->
        <div class="proposal-container" id="proposalContainer"></div>
        
    </div>
    
    <!-- Load Scripts -->
    <script src="rebate-calculator.js"></script>
    <script src="venomvision-mvp.js"></script>
    <script src="venomparser-v11.5-enhanced.js"></script>
    <script src="venomprojects-complete-integration.js"></script>
    
    <script>
        // Configuration
        const CONFIG = {
            // Add your API keys here
            googleApiKey: null,  // Get from: https://console.cloud.google.com/
            mapboxToken: null    // Get from: https://account.mapbox.com/
        };
        
        // Initialize system on page load
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Initializing VenomProjects Complete System...');
            initializeVenomSystem(CONFIG);
        });
        
        // Drag and drop handlers
        const uploadZone = document.getElementById('uploadZone');
        
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type === 'application/pdf') {
                processFile(files[0]);
            } else {
                alert('Please drop a PDF file');
            }
        });
        
        // File upload handler
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                processFile(file);
            }
        }
        
        // Process file
        function processFile(file) {
            console.log('📄 Processing file:', file.name);
            
            // Hide upload, show progress
            document.querySelector('.upload-section').style.display = 'none';
            document.getElementById('progressSection').classList.add('active');
            document.getElementById('errorSection').classList.remove('active');
            document.getElementById('proposalContainer').classList.remove('active');
            
            // Process with complete system
            processBillComplete(
                file,
                onProgress,
                onComplete,
                onError
            );
        }
        
        // Progress callback
        function onProgress(progress) {
            const icon = document.getElementById('progressIcon');
            const phase = document.getElementById('progressPhase');
            const bar = document.getElementById('progressBar');
            const percent = document.getElementById('progressPercent');
            
            icon.textContent = progress.icon || '⏳';
            phase.textContent = progress.phase;
            bar.style.width = progress.progress + '%';
            percent.textContent = progress.progress + '%';
        }
        
        // Complete callback
        function onComplete(proposal) {
            console.log('✅ Proposal complete:', proposal);
            
            // Hide progress, show proposal
            document.getElementById('progressSection').classList.remove('active');
            document.getElementById('proposalContainer').classList.add('active');
            
            // Render proposal
            renderCompleteProposal(proposal, 'proposalContainer');
            
            // Scroll to proposal
            setTimeout(() => {
                document.getElementById('proposalContainer').scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }, 500);
        }
        
        // Error callback
        function onError(error) {
            console.error('❌ Error:', error);
            
            // Hide progress, show error
            document.getElementById('progressSection').classList.remove('active');
            document.getElementById('errorSection').classList.add('active');
            document.getElementById('errorMessage').textContent = error.message;
        }
        
        // Reset upload
        function resetUpload() {
            document.querySelector('.upload-section').style.display = 'block';
            document.getElementById('errorSection').classList.remove('active');
            document.getElementById('proposalContainer').classList.remove('active');
            document.getElementById('fileInput').value = '';
        }
    </script>
    
</body>
</html>
